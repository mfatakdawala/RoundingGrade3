<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rounding Practice</title>
<style>
:root{--bg:#e8f4ff;--card:#fff;--ink:#16324f;--soft:#5b7a99;--main:#1f7ae0;--main-ink:#fff;--good:#1e9e5a;--goodbg:#dff6e8;--bad:#d6402f;--badbg:#fde6e2;--sun:#ffc83d;--line:#cfe2f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c2b;--card:#182a3f;--ink:#eaf3ff;--soft:#9db6d0;--main:#4b9bff;--main-ink:#07213f;--good:#5fd78f;--goodbg:#16382a;--bad:#ff8a7a;--badbg:#42211d;--sun:#ffc83d;--line:#2b4562}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:520px}
h1{font-size:30px;margin:8px 0 4px;text-align:center}
p.sub{text-align:center;color:var(--soft);margin:0 0 20px;font-size:18px}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 6px 0 var(--line)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:16px 20px;font-weight:700;font-size:20px;background:var(--main);color:var(--main-ink);width:100%;touch-action:manipulation}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.alt{background:transparent;color:var(--main);box-shadow:inset 0 0 0 3px var(--main)}
.stack{display:grid;gap:14px}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:12px}
.pts{background:var(--sun);color:#3a2a00;border-radius:999px;padding:6px 14px}
.dots{display:flex;gap:6px;margin-bottom:18px}
.dots i{flex:1;height:10px;border-radius:6px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--main)}
.ask{text-align:center;font-size:20px;color:var(--soft)}
.num{text-align:center;font-size:84px;font-weight:800;line-height:1.1;margin:6px 0 4px}
.tgt{text-align:center;font-size:22px;font-weight:700;margin-bottom:16px}
input{width:100%;font:inherit;font-size:40px;font-weight:700;text-align:center;padding:12px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:14px}
.fb{border-radius:16px;padding:16px;margin-top:16px;font-size:19px;line-height:1.45}
.fb.good{background:var(--goodbg)}.fb.bad{background:var(--badbg)}
.fb b.t{display:block;font-size:24px;margin-bottom:6px}
.fb.good b.t{color:var(--good)}.fb.bad b.t{color:var(--bad)}
.big{font-size:64px;text-align:center;font-weight:800;margin:4px 0}
.msg{text-align:center;font-size:21px;line-height:1.4;margin:0 0 18px}
.rule{font-size:16px;color:var(--soft);margin-top:18px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}}
</style>
</head>
<body>
<main>
  <h1>Rounding Practice</h1>

  <section id="menu">
    <p class="sub">Pick what to practice</p>
    <div class="card stack">
      <button data-mode="10">Round to the nearest 10</button>
      <button data-mode="100">Round to the nearest 100</button>
      <p class="rule">Each round has 10 questions. Numbers go from 0 to 1000. A number ending exactly in 5 (like 35) rounds up.</p>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="card">
      <div class="top"><span id="qn"></span><span class="pts" id="pts"></span></div>
      <div class="dots" id="dots"></div>
      <div class="ask">Round this number</div>
      <div class="num" id="num"></div>
      <div class="tgt" id="tgt"></div>
      <input id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Your answer" aria-label="Your answer">
      <button id="check">Check</button>
      <div id="fb" class="fb hidden" aria-live="polite"></div>
      <button id="next" class="hidden" style="margin-top:14px">Next question</button>
    </div>
  </section>

  <section id="done" class="hidden">
    <div class="card">
      <div class="big" id="dEmoji"></div>
      <div class="big" id="dScore"></div>
      <p class="msg" id="dMsg"></p>
      <div class="stack">
        <button id="again">Practice again</button>
        <button id="home" class="alt">Choose a different practice</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var TOTAL=10, mode=10, i=0, right=0, points=0, cur=0, results=[], answered=false;
  var $=function(id){return document.getElementById(id)};
  function show(id){["menu","quiz","done"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)})}

  function roundTo(n,m){return Math.floor(n/m+0.5)*m}
  function newNumber(){
    var n;
    do{ n=Math.floor(Math.random()*1001) }while(n%mode===0 || n===0);
    return n;
  }

  function reason(n,ans){
    var lo=Math.floor(n/mode)*mode, hi=lo+mode;
    var digit = mode===10 ? n%10 : Math.floor((n%100)/10);
    var place = mode===10 ? "ones digit" : "tens digit";
    var up = digit>=5;
    var s = n+" is between "+lo+" and "+hi+". Look at the "+place+": it is "+digit+". ";
    s += up ? digit+" is 5 or more, so we round up to "+ans+"." : digit+" is 4 or less, so we round down to "+ans+".";
    return s;
  }

  function render(){
    $("qn").textContent="Question "+(i+1)+" of "+TOTAL;
    $("pts").textContent=points+" points";
    var d=$("dots"); d.innerHTML="";
    for(var k=0;k<TOTAL;k++){var e=document.createElement("i");
      if(k<results.length) e.className=results[k]?"ok":"no"; else if(k===i) e.className="now"; d.appendChild(e);}
    $("num").textContent=cur;
    $("tgt").textContent="to the nearest "+mode;
    $("ans").value=""; $("ans").disabled=false;
    $("fb").classList.add("hidden"); $("next").classList.add("hidden");
    $("check").classList.remove("hidden");
    answered=false;
    setTimeout(function(){$("ans").focus()},50);
  }

  function start(m){mode=m;i=0;right=0;points=0;results=[];cur=newNumber();show("quiz");render()}

  function check(){
    if(answered) return;
    var raw=$("ans").value.trim();
    if(raw===""||!/^\d+$/.test(raw)){ $("ans").focus(); return; }
    var guess=parseInt(raw,10), ans=roundTo(cur,mode), ok=guess===ans;
    answered=true; results.push(ok);
    var fb=$("fb");
    if(ok){
      right++; points+=10;
      var cheers=["Great job!","Spot on!","You got it!","Nice rounding!","Correct!"];
      fb.className="fb good pop";
      fb.innerHTML="<b class='t'>"+cheers[Math.floor(Math.random()*cheers.length)]+" +10 points</b>"+cur+" rounds to "+ans+".";
    }else{
      fb.className="fb bad";
      fb.innerHTML="<b class='t'>Not quite. The answer is "+ans+".</b>You wrote "+guess+". "+reason(cur,ans);
    }
    $("pts").textContent=points+" points";
    $("ans").disabled=true;
    $("check").classList.add("hidden");
    $("next").textContent = i===TOTAL-1 ? "See my score" : "Next question";
    $("next").classList.remove("hidden");
    var d=$("dots").children; d[i].className=ok?"ok":"no";
  }

  function next(){
    if(i===TOTAL-1){ finish(); return; }
    i++; cur=newNumber(); render();
  }

  function finish(){
    show("done");
    $("dScore").textContent=right+" / "+TOTAL;
    var e,m;
    if(right===TOTAL){e="\uD83C\uDFC6";m="PERFECT! 10 out of 10! You are a rounding champion. You scored "+points+" points!"}
    else if(right>=8){e="\uD83C\uDF1F";m="Awesome work! Only "+(TOTAL-right)+" to fix. Try again for a perfect score. "+points+" points!"}
    else if(right>=5){e="\uD83D\uDC4D";m="Good effort! "+points+" points. Practice makes perfect, so try another round."}
    else{e="\uD83D\uDCAA";m="Keep going! Remember to look at the digit right next to the place you are rounding to. Try again!"}
    $("dEmoji").textContent=e; $("dMsg").textContent=m;
  }

  document.querySelectorAll("[data-mode]").forEach(function(b){
    b.addEventListener("click",function(){start(parseInt(b.getAttribute("data-mode"),10))})});
  $("check").addEventListener("click",check);
  $("next").addEventListener("click",next);
  $("again").addEventListener("click",function(){start(mode)});
  $("home").addEventListener("click",function(){show("menu")});
  $("ans").addEventListener("keydown",function(e){if(e.key==="Enter")check()});
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&answered)next()});
})();
</script>
</body>
</html>
